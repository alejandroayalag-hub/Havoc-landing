<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  * { margin:0; box-sizing:border-box; }
  html,body { width:1200px; height:630px; }
  body {
    position:relative; overflow:hidden;
    background:#1E1533; color:#fff;
    font-family:"Space Grotesk",sans-serif;
    display:flex; flex-direction:column; justify-content:center;
    padding:0 96px;
  }
  .glow {
    position:absolute; top:-40%; left:60%; width:900px; height:900px;
    transform:translateX(-50%);
    background:radial-gradient(circle, rgba(139,92,246,.35), transparent 62%);
  }
  .row { position:relative; display:flex; align-items:center; gap:20px; margin-bottom:38px; }
  svg { width:88px; height:88px; filter:drop-shadow(0 6px 18px rgba(139,92,246,.45)); }
  .name { font-weight:700; font-size:58px; letter-spacing:.02em; }
  h1 { position:relative; font-weight:700; font-size:96px; line-height:1.02; letter-spacing:-.02em; }
  h1 .accent { color:#8B5CF6; }
  .sub {
    position:relative; margin-top:34px;
    font-family:"IBM Plex Mono",monospace; font-weight:500;
    font-size:26px; letter-spacing:.16em; text-transform:uppercase; color:#A78BFA;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="row">
    <svg viewBox="0 0 100 100">
      <defs><linearGradient id="s" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#6D28D9"/>
      </linearGradient></defs>
      <polygon points="50,18 40,30 40,44 50,54 60,44 60,30" fill="#7C3AED"/>
      <polygon points="50,18 40,30 40,44 50,54" fill="#A78BFA"/>
      <polygon points="50,18 40,30 60,30" fill="#C4B5FD"/>
      <rect x="33" y="56" width="34" height="7" rx="3.5" fill="url(#s)"/>
      <rect x="45" y="60" width="10" height="26" rx="5" fill="url(#s)"/>
    </svg>
    <span class="name">HAVOC</span>
  </div>
  <h1>Control sobre el<br><span class="accent">caos operativo.</span></h1>
  <p class="sub">Soluciones Integradas · Desarrollo de software</p>
</body>
</html>
